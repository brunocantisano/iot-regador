; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nodemcuv2]
platform                = espressif8266
board                   = nodemcuv2
framework               = arduino
monitor_speed           = 115200
upload_speed            = 115200
board_build.filesystem  = littlefs

lib_deps =    
    https://github.com/me-no-dev/ESPAsyncTCP.git          ; substitui AsyncTCP
    https://github.com/me-no-dev/ESPAsyncWebServer.git    ; substitui mathieucarbou/ESPAsyncWebServer    
    rweather/Crypto @ ^0.4.0
    ayushsharma82/ElegantOTA
    bblanchon/ArduinoJson
    suculent/AESLib
    arduino-libraries/NTPClient
    nickgammon/Regexp
    adafruit/Adafruit MQTT Library
    https://github.com/Jockey-Repos/ArduinoUtilsCds.git

lib_ignore =
    AsyncTCP
    AsyncTCP_RP2040W
    LittleFS_esp32
    WiFi101
    WiFiNINA_-_Adafruit_Fork
    WiFiNINA

build_flags =
    -D DEBUG
    -D USE_CRYPTO
    -D ESP8266
    -D USE_MQTT
    -D API_VERSION=\"1.0.0\"
    -D SERIAL_BAUD=115200
    -D MAX_PATH=256
    -D MAX_STRING_LENGTH=20000
    -D MAX_FLOAT=5
    -D ELEGANTOTA_USE_ASYNC_WEBSERVER=1
    -D AES_KEY_HEX='"000102030405060708090A0B0C0D0E0F"'
    -D AES_IV_HEX='"A0A1A2A3A4A5A6A7A8A9AAABACADAEAF"'
    -D ELEGANTOTA_USE_ASYNC_WEBSERVER=1
    -I "$PROJECT_INCLUDE_DIR"
    -D DEBUG_OUTPUT=Serial
    -D CORE_DEBUG_LEVEL=0
    -Os
    -Wl,--gc-sections

build_src_filter =
    +<*>
